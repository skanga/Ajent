name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: JDK 25 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          mvn-toolchain-id: jdk-25
          mvn-toolchain-vendor: temurin
      - name: Use the runner JDK 25 toolchain
        shell: pwsh
        run: Copy-Item -LiteralPath (Join-Path $HOME '.m2/toolchains.xml') -Destination '.mvn/toolchains.xml' -Force
      - name: Verify reactor on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp verify
      - name: Verify reactor on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore

  dependency-check:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          mvn-toolchain-id: jdk-25
          mvn-toolchain-vendor: temurin
      - name: Use the runner JDK 25 toolchain
        shell: pwsh
        run: Copy-Item -LiteralPath (Join-Path $HOME '.m2/toolchains.xml') -Destination '.mvn/toolchains.xml' -Force
      - name: Restore vulnerability database
        id: dependency-check-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml', '**/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-
      - name: Scan dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Psecurity -DskipTests -Ddependency.check.fail.unused=true verify
      - name: Save vulnerability database
        if: always() && steps.dependency-check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/dependency-check-data
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}
      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
          if-no-files-found: ignore
