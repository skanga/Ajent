name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: JDK 25 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          mvn-toolchain-id: jdk-25
          mvn-toolchain-vendor: temurin
      - name: Use the runner JDK 25 toolchain
        shell: pwsh
        run: Copy-Item -LiteralPath (Join-Path $HOME '.m2/toolchains.xml') -Destination '.mvn/toolchains.xml' -Force
      - name: Verify reactor
        shell: pwsh
        run: |
          if ($IsWindows) {
            .\mvnw.cmd -B -ntp verify
          } else {
            ./mvnw -B -ntp verify
          }
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore
